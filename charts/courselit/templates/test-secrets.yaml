{{/*
Generate test secrets for CI environments
This template creates the required secrets with test values when deploying with CI values files
*/}}
{{- if .Values.createTestSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.secrets.authSecretRef.name }}
  labels:
    {{- include "courselit.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-secrets
type: Opaque
stringData:
  {{ .Values.app.secrets.authSecretRef.key }}: "test-auth-secret-for-ci-testing-only"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.secrets.emailSecretRef.name }}
  labels:
    {{- include "courselit.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-secrets
type: Opaque
stringData:
  {{ .Values.app.secrets.emailSecretRef.userKey }}: "test@example.com"
  {{ .Values.app.secrets.emailSecretRef.passKey }}: "test-password"
  {{ .Values.app.secrets.emailSecretRef.hostKey }}: "smtp.example.com"
  {{ .Values.app.secrets.emailSecretRef.fromKey }}: "noreply@example.com"
{{- if .Values.mongodb.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mongodb.auth.existingSecret }}
  labels:
    {{- include "courselit.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-secrets
type: Opaque
stringData:
  {{ .Values.mongodb.auth.secretKey }}: "test-mongodb-password"
{{- end }}
{{- if and .Values.queue.enabled .Values.queue.secrets.courselitJwtSecretRef.name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.queue.secrets.courselitJwtSecretRef.name }}
  labels:
    {{- include "courselit.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-secrets
type: Opaque
stringData:
  {{ .Values.queue.secrets.courselitJwtSecretRef.key }}: "test-auth-secret-for-ci-testing-only"
{{- end }}
{{- end }}
