# CI test values - enables MongoDB operator for kind cluster testing
# This file is used by chart-testing in GitHub Actions workflow

app:
  config:
    superAdminEmail: admin@example.com

  # Disable ingress in CI - kind cluster doesn't have ingress controller
  ingress:
    enabled: false

  # Gateway API also disabled for CI
  gateway:
    enabled: false

  # Use secrets that will be created in CI
  secrets:
    authSecretRef:
      name: courselit-auth
      key: auth-secret
    emailSecretRef:
      name: courselit-email
      userKey: email-user
      passKey: email-pass
      hostKey: email-host
      fromKey: email-from

mongodb:
  # Deploy simple MongoDB StatefulSet for CI testing
  enabled: true

  # Use simple deployment mode (not operator)
  useOperator: false

  # Don't deploy operator as subchart in CI
  operator:
    enabled: false

  # Use smaller resources for CI
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  storage:
    size: 5Gi  # Smaller for CI

# Disable queue service in default CI test
queue:
  enabled: false

# Disable MediaLit in default CI test
medialit:
  enabled: false
